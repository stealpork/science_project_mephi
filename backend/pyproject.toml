[project]
name = "science-interaction-backend"
version = "0.1.0"
description = "Service-oriented backend for scientific collaboration"
requires-python = ">=3.13,<3.15"
dependencies = [
  "fastapi>=0.121,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy[asyncio]>=2.0.36,<2.1",
  "asyncpg>=0.30,<1",
  "alembic>=1.14,<2",
  "httpx>=0.28,<1",
  "PyJWT[crypto]>=2.10,<3",
  "argon2-cffi>=23.1,<26",
  "email-validator>=2.2,<3",
  "aio-pika>=9.5,<10",
  "redis>=5.2,<7",
  "boto3>=1.35,<2",
  "prometheus-client>=0.21,<1",
  "pypdf>=5,<7",
  "Pillow>=13,<14",
  "aiosmtplib>=3,<6",
  "pyotp>=2.9,<3",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
  "mypy>=1.14,<2",
  "types-PyYAML>=6,<7",
  "pyyaml>=6,<7",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: real infrastructure tests", "e2e: black-box HTTP tests", "unit: isolated domain tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
check_untyped_defs = true
exclude = ["migrations/versions"]

[tool.coverage.run]
branch = true
source = ["services", "libs"]
parallel = true
relative_files = true
sigterm = true
omit = ["*/migrations/*"]

[tool.coverage.paths]
services = ["services", "/app/services"]
libs = ["libs", "/app/libs"]

[tool.coverage.report]
show_missing = true
skip_empty = true
