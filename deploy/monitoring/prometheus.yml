global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files: [/etc/prometheus/alerts.yml]
alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]
scrape_configs:
  - job_name: api
    static_configs:
      - targets: [identity:8000, people:8000, projects:8000, publications:8000, media:8000, activity:8000]
  - job_name: workers
    static_configs:
      - targets: [identity-worker:8001, people-worker:8001, projects-worker:8001, publications-worker:8001, media-worker:8001, activity-worker:8001]
  - job_name: rabbitmq
    static_configs:
      - targets: [rabbitmq:15692]
  - job_name: backup
    static_configs:
      - targets: [backup-metrics:9100]
  - job_name: alertmanager
    static_configs:
      - targets: [alertmanager:9093]
