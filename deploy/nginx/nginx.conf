worker_processes auto;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    server_tokens off;
    resolver 127.0.0.11 valid=10s ipv6=off;
    log_format safe '$time_iso8601 $request_method $status $request_time $request_id';
    access_log /var/log/nginx/access.log safe;
    limit_req_zone $binary_remote_addr zone=api:10m rate=50r/s;
    map $uri $backend {
        ~^/api/v1/(auth|account)(/|$) identity:8000;
        ~^/api/v1/(users|dictionaries)(/|$) people:8000;
        ~^/api/v1/me/(profile|dictionary-suggestions)(/|$) people:8000;
        ~^/api/v1/recommendations/users$ people:8000;
        ~^/api/v1/(projects)(/|$) projects:8000;
        ~^/api/v1/me/(projects|teams|applications|invitations)(/|$) projects:8000;
        ~^/api/v1/recommendations/projects$ projects:8000;
        ~^/api/v1/(papers)(/|$) publications:8000;
        ~^/api/v1/me/papers(/|$) publications:8000;
        ~^/api/v1/media(/|$) media:8000;
        ~^/api/v1/(favorites|notifications|reports|admin)(/|$) activity:8000;
        default "";
    }
    server {
        listen 80;
        root /usr/share/nginx/html;
        client_max_body_size 2m;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header X-Frame-Options DENY always;
        add_header Permissions-Policy 'camera=(), microphone=(), geolocation=()' always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' https: data: blob: http://localhost:* http://127.0.0.1:*; connect-src 'self' https: http://localhost:* http://127.0.0.1:*; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        location = /health { access_log off; return 200 'ok'; }
        location /internal { return 404; }
        location /api/ {
            if ($backend = "") { return 404; }
            limit_req zone=api burst=100 nodelay;
            proxy_pass http://$backend$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }
        location /assets/ { try_files $uri =404; expires 1y; }
        location / { try_files $uri $uri/ /index.html; expires -1; }
    }
    server {
        listen 9000;
        client_max_body_size 26m;
        location / {
            set $s3 minio:9000;
            proxy_pass http://$s3;
            proxy_set_header Host $http_host;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 300s;
        }
    }
}
