name: ${COMPOSE_PROJECT_NAME:-science}

x-app-env: &app-env
  SC_ENVIRONMENT: ${SC_ENVIRONMENT:-development}
  SC_INTERNAL_TOKEN_HASHES: ${INTERNAL_TOKEN_HASHES:?Run init first}
  SC_RABBITMQ_URL: ${RABBITMQ_URL:-amqp://science:${RABBITMQ_PASSWORD}@rabbitmq/}
  SC_REDIS_URL: ${REDIS_URL:-redis://:${REDIS_PASSWORD}@redis:6379/0}
  SC_JWT_PUBLIC_KEY_FILE: /run/secrets/jwt_public.pem
  SC_JWT_KEY_ID: '${JWT_KEY_ID:-local-v1}'
  SC_JWT_ADDITIONAL_PUBLIC_KEYS: '${JWT_ADDITIONAL_PUBLIC_KEYS:-null}'
  SC_PUBLIC_URL: ${PUBLIC_URL:-http://localhost:${APP_PORT:-18080}}
  SC_S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:${S3_PORT:-19000}}
  SC_ALLOWED_ORIGINS: '${ALLOWED_ORIGINS:-["http://localhost:18080","http://localhost:4173"]}'
  SC_EMAIL_VERIFICATION_REQUIRED: ${EMAIL_VERIFICATION_REQUIRED:-false}
  SC_ADMIN_2FA_REQUIRED: ${ADMIN_2FA_REQUIRED:-false}

x-app: &app
  build:
    context: ..
    dockerfile: backend/Dockerfile
    target: base
  image: science-backend:${RELEASE:-local}
  restart: unless-stopped
  user: '${APP_UID:-10001}:${APP_GID:-10001}'
  init: true
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  networks: [application]
  volumes:
    - ${SECRET_DIRECTORY}/jwt_public.pem:/run/secrets/jwt_public.pem:ro
  healthcheck:
    test: [CMD, python, -S, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
    interval: 10s
    timeout: 5s
    retries: 12
    start_period: 30s
  mem_limit: 384m

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: science
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      IDENTITY_DATABASE_PASSWORD: ${IDENTITY_DATABASE_PASSWORD}
      PEOPLE_DATABASE_PASSWORD: ${PEOPLE_DATABASE_PASSWORD}
      PROJECTS_DATABASE_PASSWORD: ${PROJECTS_DATABASE_PASSWORD}
      PUBLICATIONS_DATABASE_PASSWORD: ${PUBLICATIONS_DATABASE_PASSWORD}
      MEDIA_DATABASE_PASSWORD: ${MEDIA_DATABASE_PASSWORD}
      ACTIVITY_DATABASE_PASSWORD: ${ACTIVITY_DATABASE_PASSWORD}
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./postgres/init.sh:/docker-entrypoint-initdb.d/10-services.sh:ro
    networks: [application]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U science -d postgres]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4.2-management-alpine
    hostname: ${RABBITMQ_HOSTNAME:-rabbitmq}
    environment:
      RABBITMQ_DEFAULT_USER: science
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_NODENAME: ${RABBITMQ_NODENAME:-rabbit@rabbitmq}
    volumes: [rabbitmq:/var/lib/rabbitmq]
    configs:
      - source: rabbitmq_plugins
        target: /etc/rabbitmq/enabled_plugins
    networks: [application]
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, ping]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: [sh, -c, 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    volumes: [redis:/data]
    networks: [application]
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    build: {context: ./minio}
    image: science-minio:2025-09-07
    command: [server, /data, --console-address, ':9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:${APP_PORT:-18080},http://localhost:4173
    volumes: [minio:/data]
    networks: [application]
    restart: unless-stopped

  mailpit:
    image: ghcr.io/axllent/mailpit:v1.31.6
    environment: {MP_DATABASE: /data/mailpit.db}
    volumes: [mailpit:/data]
    ports: ['127.0.0.1:${MAIL_PORT:-18025}:8025']
    networks: [application]
    restart: unless-stopped

  minio-init:
    image: science-minio:2025-09-07
    entrypoint: [science-minio-init]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
    networks: [application]
    profiles: [init]

  clamav:
    image: clamav/clamav:1.4
    volumes: [clamav:/var/lib/clamav]
    networks: [application]
    mem_limit: 2g
    restart: unless-stopped

  identity:
    <<: *app
    environment:
      <<: *app-env
      SC_SERVICE_NAME: identity
      SC_DATABASE_URL: ${IDENTITY_DATABASE_URL:-postgresql+asyncpg://identity:${IDENTITY_DATABASE_PASSWORD}@postgres/identity}
      SC_SERVICE_TOKEN: ${IDENTITY_SERVICE_TOKEN}
      SC_JWT_PRIVATE_KEY_FILE: /run/secrets/jwt_private.pem
      SC_MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY}
      SC_SMTP_HOST: ${SMTP_HOST:-mailpit}
      SC_SMTP_PORT: ${SMTP_PORT:-1025}
      SC_SMTP_USERNAME: ${SMTP_USERNAME:-}
      SC_SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SC_SMTP_SECURITY: ${SMTP_SECURITY:-none}
      SC_MAIL_FROM: ${MAIL_FROM:-science@example.test}
    volumes:
      - ${SECRET_DIRECTORY}/jwt_public.pem:/run/secrets/jwt_public.pem:ro
      - ${SECRET_DIRECTORY}/jwt_private.pem:/run/secrets/jwt_private.pem:ro

  people:
    <<: *app
    environment:
      <<: *app-env
      SC_SERVICE_NAME: people
      SC_DATABASE_URL: ${PEOPLE_DATABASE_URL:-postgresql+asyncpg://people:${PEOPLE_DATABASE_PASSWORD}@postgres/people}
      SC_SERVICE_TOKEN: ${PEOPLE_SERVICE_TOKEN}

  projects:
    <<: *app
    environment:
      <<: *app-env
      SC_SERVICE_NAME: projects
      SC_DATABASE_URL: ${PROJECTS_DATABASE_URL:-postgresql+asyncpg://projects:${PROJECTS_DATABASE_PASSWORD}@postgres/projects}
      SC_SERVICE_TOKEN: ${PROJECTS_SERVICE_TOKEN}

  publications:
    <<: *app
    environment:
      <<: *app-env
      SC_SERVICE_NAME: publications
      SC_DATABASE_URL: ${PUBLICATIONS_DATABASE_URL:-postgresql+asyncpg://publications:${PUBLICATIONS_DATABASE_PASSWORD}@postgres/publications}
      SC_SERVICE_TOKEN: ${PUBLICATIONS_SERVICE_TOKEN}

  media:
    <<: *app
    environment:
      <<: *app-env
      SC_SERVICE_NAME: media
      SC_DATABASE_URL: ${MEDIA_DATABASE_URL:-postgresql+asyncpg://media:${MEDIA_DATABASE_PASSWORD}@postgres/media}
      SC_SERVICE_TOKEN: ${MEDIA_SERVICE_TOKEN}
      SC_S3_INTERNAL_ENDPOINT: ${S3_INTERNAL_ENDPOINT:-http://minio:9000}
      SC_S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:${S3_PORT:-19000}}
      SC_S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      SC_S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      SC_SCANNER_REQUIRED: ${SCANNER_REQUIRED:-true}
      SC_S3_REGION: ${S3_REGION:-us-east-1}
      SC_S3_ADDRESSING_STYLE: ${S3_ADDRESSING_STYLE:-path}
      SC_S3_MANAGE_CORS: ${S3_MANAGE_CORS:-false}

  activity:
    <<: *app
    environment:
      <<: *app-env
      SC_SERVICE_NAME: activity
      SC_DATABASE_URL: ${ACTIVITY_DATABASE_URL:-postgresql+asyncpg://activity:${ACTIVITY_DATABASE_PASSWORD}@postgres/activity}
      SC_SERVICE_TOKEN: ${ACTIVITY_SERVICE_TOKEN}

  identity-worker:
    extends: identity
    command: [python, -m, libs.platform.worker]
    healthcheck: &worker-health
      test: [CMD, python, -S, -c, "import os,time; assert time.time()-os.stat('/tmp/worker-ready').st_mtime < 20"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s

  people-worker:
    extends: people
    command: [python, -m, libs.platform.worker]
    healthcheck: *worker-health

  projects-worker:
    extends: projects
    command: [python, -m, libs.platform.worker]
    healthcheck: *worker-health

  publications-worker:
    extends: publications
    command: [python, -m, libs.platform.worker]
    healthcheck: *worker-health

  media-worker:
    extends: media
    command: [python, -m, libs.platform.worker]
    healthcheck: *worker-health
    mem_limit: 768m

  activity-worker:
    extends: activity
    command: [python, -m, libs.platform.worker]
    healthcheck: *worker-health

  nginx:
    build: {context: .., dockerfile: deploy/nginx/Dockerfile}
    image: science-web:${RELEASE:-local}
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - '127.0.0.1:${APP_PORT:-18080}:80'
      - '127.0.0.1:${S3_PORT:-19000}:9000'
    networks: [application]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.2.1
    command: [--config.file=/etc/prometheus/prometheus.yml, --storage.tsdb.retention.time=15d]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus:/prometheus
    ports: ['127.0.0.1:${PROMETHEUS_PORT:-19090}:9090']
    networks: [application]
    profiles: [monitoring]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.6.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
    volumes:
      - ./monitoring/grafana:/etc/grafana/provisioning:ro
      - grafana:/var/lib/grafana
    ports: ['127.0.0.1:${GRAFANA_PORT:-13000}:3000']
    networks: [application]
    profiles: [monitoring]
    restart: unless-stopped

  alertmanager-init:
    image: alpine:3.22
    user: '0:0'
    environment:
      SC_UID: '${APP_UID:-10001}'
      SC_GID: '${APP_GID:-10001}'
    command: [sh, -ec, 'chown -R "$${SC_UID}:$${SC_GID}" /data; chmod 0700 /data']
    volumes: [alertmanager:/data]
    network_mode: none
    profiles: [monitoring]
    restart: 'no'

  alertmanager:
    image: prom/alertmanager:v0.35.0@sha256:e638797febd034838eca8b98cdbd46f951e9bf7f178777aa8669167406a9946c
    user: '${APP_UID:-10001}:${APP_GID:-10001}'
    command: [--config.file=/etc/alertmanager/config.yml, --storage.path=/alertmanager, --cluster.listen-address=]
    depends_on:
      alertmanager-init: {condition: service_completed_successfully}
    volumes:
      - type: bind
        source: ${SECRET_DIRECTORY}/alertmanager.yml
        target: /etc/alertmanager/config.yml
        read_only: true
        bind: {create_host_path: false}
      - alertmanager:/alertmanager
    ports: ['127.0.0.1:${ALERTMANAGER_PORT:-19093}:9093']
    networks: [application]
    profiles: [monitoring]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, wget, -q, -O, '-', 'http://localhost:9093/-/ready']
      interval: 10s
      timeout: 5s
      retries: 6

  backup-metrics:
    image: prom/node-exporter:v1.9.1
    user: '${APP_UID:-10001}:${APP_GID:-10001}'
    command: [--collector.disable-defaults, --collector.textfile, --collector.textfile.directory=/textfiles]
    volumes:
      - type: bind
        source: ../backups/metrics
        target: /textfiles
        read_only: true
        bind: {create_host_path: false}
    networks: [application]
    profiles: [monitoring]
    restart: unless-stopped

configs:
  rabbitmq_plugins:
    file: ./rabbitmq/enabled_plugins

networks:
  application:

volumes:
  alertmanager:
  prometheus:
  grafana:
  postgres:
  rabbitmq:
  redis:
  minio:
  mailpit:
  clamav:
